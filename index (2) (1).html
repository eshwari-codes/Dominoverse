function renderModal(){if(!state.onboardingOpen)return'';return`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-title"><span class="eyebrow">Welcome to DominoVerse</span><h2 id="profile-title">Start discovering the questions behind your doubts.</h2><p>Create an optional learner profile for this browser, or jump into a guided investigation as a guest. No account or password required.</p><form id="profile-form"><label class="field">Display name <input name="name" type="text" maxlength="40" autocomplete="nickname" placeholder="e.g. Alex" value="${e(state.profile?.mode==='local'?state.profile.name:'')}" required></label><label class="field">Class / learning level (optional)<input name="level" type="text" maxlength="55" placeholder="e.g. First-year college" value="${e(state.profile?.level||'')}"></label><label class="field">Subject interest (optional)<input name="interest" type="text" maxlength="60" placeholder="e.g. Mathematics" value="${e(state.profile?.interest||'')}"></label><button class="btn btn-primary" type="submit" style="width:100%">${state.profile?.mode==='local'?'Update local profile':'Create local learner profile'}</button></form><div class="btn-row" style="margin-top:12px"><button type="button" class="btn btn-quiet" data-act="guest">Continue as guest</button><button type="button" class="btn btn-quiet" data-act="guided">Try guided investigation</button>${state.profile?'<button type="button" class="btn btn-quiet" data-act="close-profile">Keep current profile</button>':''}</div><p class="notice"><strong>Local prototype, not secure cloud login.</strong> A profile and saved investigations are stored only in this browser when supported. No passwords, sync, or online accounts.</p>${!storageAvailable?'<p class="feedback neutral-feedback">Browser storage is unavailable. You can still explore during this session.</p>':''}</section></div>`}
function renderHome(){return`<main class="app-shell no-report-print" id="main"><section class="hero"><div><span class="eyebrow">A new way to connect the dots</span><h1>Every big discovery starts with <span>a better question.</span></h1><p class="hero-lead">What are you struggling to understand? Start with a doubt. Discover the questions underneath it, map the connections, and test what you really know.</p><form id="question-form" class="question-entry"><label for="question-input">YOUR QUESTION OR DOUBT</label><textarea id="question-input" name="question" maxlength="600" placeholder="e.g. Why can a function value be different from its limit?" aria-describedby="question-validation"></textarea><div class="btn-row"><button class="btn btn-primary" type="submit">Start an investigation <span aria-hidden="true">↗</span></button><button class="btn btn-quiet" type="button" data-act="guided">Try guided demo</button></div><div id="question-validation" class="form-error" role="alert">${e(state.ui.inputError)}</div></form><p class="microcopy">Offline by design · Real question links · Curated explanations, not live AI</p></div><div class="hero-art site-grid-dots" aria-label="Illustration: a central question branching to related concepts"><span class="art-label">The discovery universe</span><svg viewBox="0 0 570 430" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><radialGradient id="halo"><stop offset="0" stop-color="#35c7bc" stop-opacity=".3"/><stop offset="1" stop-color="#35c7bc" stop-opacity="0"/></radialGradient></defs><circle cx="285" cy="218" r="155" fill="url(#halo)"/><g stroke="#4bcfc7" stroke-opacity=".42" fill="none" stroke-width="2"><path d="M279 204Q195 116 110 114M288 213Q400 108 479 123M291 222Q427 212 497 247M283 230Q211 335 129 342M284 220Q175 225 91 242M288 224Q357 335 455 340"/></g><g fill="#122a3c" stroke="#64dacc" stroke-width="1.5"><rect x="29" y="85" width="148" height="55" rx="15"/><rect x="408" y="94" width="133" height="55" rx="15"/><rect x="421" y="217" width="136" height="55" rx="15"/><rect x="34" y="309" width="159" height="58" rx="15"/><rect x="16" y="213" width="143" height="58" rx="15"/><rect x="378" y="315" width="165" height="55" rx="15"/></g><g fill="#cceae8" font-size="14" text-anchor="middle" font-family="system-ui"><text x="103" y="117">Prerequisites</text><text x="474" y="127">Why / How</text><text x="489" y="249">Examples</text><text x="114" y="345">Applications</text><text x="88" y="247">Common doubts</text><text x="460" y="348">Next questions</text></g><circle cx="285" cy="216" r="77" fill="#123344" stroke="#6dffec" stroke-width="2.5"/><circle cx="285" cy="216" r="65" fill="#1a4653" opacity=".6"/><text x="285" y="210" text-anchor="middle" font-size="50" fill="#f1d394" font-weight="750">?</text><text x="285" y="236" text-anchor="middle" font-size="13" fill="#b9e8e3">Your doubt</text></svg><div class="art-foot"><span>01 / QUESTION DISCOVERY</span><span>Meaningful connections →</span></div></div></section><section class="info-strip" aria-label="How it works">${[['01','Ask','Begin with a real doubt.'],['02','Discover','Find questions you missed.'],['03','Connect','Follow meaningful links.'],['04','Test','Try a new example and reflect.']].map(([num,title,desc])=>`<div class="step surface"><b>${num} / STEP</b><strong>${title}</strong><p>${desc}</p></div>`).join('')}</section><section class="section-block"><div class="section-title"><div><span class="eyebrow">Curated starting points</span><h2 style="margin:8px 0 0">Choose a universe to explore.</h2></div></div><div class="topic-grid">${[['calculus','∫','Calculus','When the nearby limit disagrees with the value at a point.'],['physics','F = ma','Physics','What net force, mass, and acceleration really mean.'],['logic','P ⇒ Q','Logic','Why an implication does not guarantee its converse.']].map(([id,symbol,title,desc])=>`<button class="topic-card" data-act="topic" data-topic="${id}"><span class="topic-symbol">${symbol}</span><h3>${title}</h3><p>${desc}</p><span class="arrow">Explore the topic ↗</span></button>`).join('')}</div></section>${renderHistory()}<section class="section-block"><div class="notice"><strong>Built for honest investigation.</strong> This prototype runs entirely in your browser with local curated educational content and transparent rules. Unknown questions receive clearly identified generic prompts, not fabricated subject answers.</div></section></main>`}
function renderHistory(){return`<section class="section-block"><div class="section-title"><div><span class="eyebrow">Your local work</span><h2 style="margin:7px 0 0">Recent investigations</h2></div><div class="btn-row">${state.investigation?'<button class="btn btn-small" data-act="resume">Resume current</button>':''}<button class="btn btn-small btn-danger" data-act="clear-all">Clear local data</button></div></div>${state.history.length?`<div class="history-list">${state.history.map(h=>`<div class="history-item"><div><strong>${e(shorten(h.title,120))}</strong><p>${e(h.topic)} · Saved ${e(new Date(h.savedAt).toLocaleString())}</p></div><div class="btn-row"><button class="btn btn-small" data-act="reopen" data-id="${e(h.id)}">Open</button><button class="btn btn-small btn-danger" data-act="delete-save" data-id="${e(h.id)}">Delete</button></div></div>`).join('')}</div>`:'<p class="muted">No manually saved investigations yet. Open a question map and choose “Save investigation” to keep one here.</p>'}${!storageAvailable?'<p class="microcopy">Storage is disabled: history is kept only while this tab remains open.</p>':''}</section>`}
function renderEmpty(section){const names={map:'Question Universe',diagnosis:'Diagnosis Lab',reversal:'Reversal Lab & Report'};return`<main class="app-shell no-report-print"><div class="page-head"><div><span class="eyebrow">${names[section]}</span><h1>Start with a question.</h1><p>No investigation is open yet. You can enter any doubt or load the fully guided calculus example to see the complete journey.</p></div></div><div class="surface panel"><div class="btn-row"><button class="btn btn-primary" data-act="nav" data-target="home">Write a question</button><button class="btn" data-act="guided">Load guided investigation</button></div></div></main>`}
function sectionHead(kicker,title,sub,right=''){return`<div class="page-head"><div><span class="eyebrow">${e(kicker)}</span><h1>${e(title)}</h1><p>${e(sub)}</p></div>${right}</div>`}
function getLayout(nodes){let positions={};const n=nodes.length-1;if(n<=9){const width=1160,height=690;positions.anchor={x:580,y:345};nodes.slice(1).forEach((node,i)=>{const a=(-Math.PI/2)+(i*2*Math.PI/Math.max(n,1));positions[node.id]={x:580+430*Math.cos(a),y:345+264*Math.sin(a)}});return{width,height,positions}}
 const left=[],right=[];nodes.slice(1).forEach((node,i)=>(i%2?right:left).push(node));const rowCount=Math.max(left.length,right.length);const height=Math.max(690,120+rowCount*94);positions.anchor={x:580,y:height/2};for(const [items,x] of [[left,215],[right,946]])items.forEach((node,i)=>{positions[node.id]={x,y:(height-(items.length-1)*94)/2+i*94}});return{width:1160,height,positions}}
function wrapSvg(s,max=21){let words=String(s).split(/\s+/),lines=[],line='';for(const word of words){if((line+' '+word).trim().length>max&&line){lines.push(line);line=word}else line=(line+' '+word).trim()}if(line)lines.push(line);if(lines.length>3){lines=lines.slice(0,3);lines[2]=shorten(lines[2],max-1)+'…'}return lines}
function nodeColor(type){if(type==='Topic/Anchor')return'#f0d28f';if(type==='Hypothesis')return'#b3b6ff';if(type==='Observed Error (Example)'||type==='Misconception')return'#ffb3a5';if(type==='Evidence')return'#9bf0b9';if(type==='Prerequisite')return'#a9c4ff';if(type==='Learning Activity'||type==='Transfer Test')return'#efce89';return'#61e2d3'}
function renderGraph(inv){const nodes=inv.added.map(id=>findNode(id,inv)).filter(Boolean),edges=graphEdges(inv),{positions,width,height}=getLayout(nodes);const sel=inv.selectedNode||'anchor';const neighbours=new Set([sel]);for(const edge of edges)if(edge.source===sel)neighbours.add(edge.target);else if(edge.target===sel)neighbours.add(edge.source);
 const z=inv.zoom||1,vw=width/z,vh=height/z,viewBox=`${(width-vw)/2} ${(height-vh)/2} ${vw} ${vh}`;
 return`<div class="graph-scroll" aria-label="Question connection graph. Use the list view if zoomed labels are difficult to read."><svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" role="group" aria-label="Interactive question map with ${nodes.length} nodes and ${edges.length} explained links" style="aspect-ratio:${width}/${height}"><defs><pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#5d9fac" opacity=".2"/></pattern></defs><rect x="0" y="0" width="${width}" height="${height}" fill="url(#dotgrid)"/>${edges.map((ed,i)=>{const a=positions[ed.source],b=positions[ed.target];if(!a||!b)return'';const involved=neighbours.has(ed.source)&&neighbours.has(ed.target),chosen=inv.edgeSelected===i;let mx=(a.x+b.x)/2,my=(a.y+b.y)/2,curve=(Math.abs(a.x-b.x)<220?25:-16);const d=`M ${a.x} ${a.y} Q ${mx} ${my+curve} ${b.x} ${b.y}`;return`<g opacity="${involved?'1':'.23'}"><path d="${d}" fill="none" stroke="${chosen?'#e7c98e':involved?'#3bc2bd':'#356c7a'}" stroke-width="${chosen?4:2}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="transparent" stroke-width="21" role="button" tabindex="0" aria-label="Edge: ${attr(findNode(ed.source,inv)?.title)} ${ed.type} ${attr(findNode(ed.target,inv)?.title)}. ${attr(ed.rationale)}" data-edge="${i}" style="cursor:pointer"><title>${e(ed.type+': '+ed.rationale)}</title></path></g>`}).join('')}${nodes.map(n=>{const p=positions[n.id],anchor=n.id==='anchor',selected=n.id===sel,light=neighbours.has(n.id),color=nodeColor(n.nodeType),w=anchor?244:208,h=anchor?96:85,lines=wrapSvg(n.title,anchor?25:22);const labelY=p.y-(lines.length-1)*10;return`<g data-node="${attr(n.id)}" role="button" tabindex="0" aria-label="${attr(n.nodeType)}: ${attr(n.title)}" opacity="${light?'1':'.36'}" style="cursor:pointer"><title>${e(n.title)}</title>${selected?`<rect x="${p.x-w/2-7}" y="${p.y-h/2-7}" width="${w+14}" height="${h+14}" rx="22" fill="none" stroke="${color}" stroke-width="2" opacity=".55"/>`:''}<rect x="${p.x-w/2}" y="${p.y-h/2}" width="${w}" height="${h}" rx="16" fill="${anchor?'#1a3b48':'#142a3d'}" stroke="${color}" stroke-width="${selected?2.6:1.4}"/><circle cx="${p.x-w/2+17}" cy="${p.y-h/2+15}" r="4.5" fill="${color}"/><text x="${p.x+w/2-12}" y="${p.y-h/2+19}" fill="${color}" text-anchor="end" font-size="11" font-weight="700">${e(shorten(n.nodeType,21))}</text><text x="${p.x}" y="${labelY+12}" font-family="system-ui" font-size="${anchor?17:15.5}" font-weight="650" text-anchor="middle" fill="#f3f8ff">${lines.map((line,i)=>`<tspan x="${p.x}" dy="${i===0?0:16}">${e(line)}</tspan>`).join('')}</text></g>`}).join('')}</svg></div>`}
function renderList(inv){const edges=graphEdges(inv);return`<div class="list-view" role="list" aria-label="Accessible question map list">${inv.added.map(id=>{const n=findNode(id,inv);if(!n)return'';const link=edges.find(ed=>ed.target===id||ed.source===id);return`<button type="button" class="tree-row ${inv.selectedNode===id?'is-selected':''}" data-node="${e(id)}" role="listitem"><span class="tree-relation">${id==='anchor'?'STARTING QUESTION':e(link?.type||'connected')}</span><span><strong>${e(n.title)}</strong><small class="muted" style="display:block">${e(shorten(n.summary||'',130))}</small></span><span class="tag">${e(n.nodeType)}</span></button>`}).join('')}</div>`}
function renderInspector(inv){const n=findNode(inv.selectedNode,inv)||findNode('anchor',inv),edges=graphEdges(inv),related=edges.filter(a=>a.source===n.id||a.target===n.id),r=recommendations(inv).find(x=>x.id===n.id),chosenEdge=Number.isInteger(inv.edgeSelected)?edges[inv.edgeSelected]:null;return`<aside class="surface inspector" aria-label="Selected node details"><div class="surface-inner"><span class="eyebrow">Selected connection</span><div style="margin-top:9px"><span class="tag ${n.nodeType==='Topic/Anchor'?'gold-tag':''}">${e(n.nodeType)}</span></div><h3>${e(n.title)}</h3><p>${e(n.summary||'')}</p><div class="relationship"><strong>${chosenEdge&& (chosenEdge.source===n.id||chosenEdge.target===n.id)?'Selected edge':n.id==='anchor'?'Anchor question':'Why this matters'}</strong><div>${e(chosenEdge&&(chosenEdge.source===n.id||chosenEdge.target===n.id)?`${chosenEdge.type}: ${chosenEdge.rationale}`:n.reason||'This is your starting doubt.')}</div></div>${r?`<p class="text-small"><strong>Concepts:</strong> ${e((r.conceptIds||[]).join(', ')||'Exploration')} · ${e(r.difficulty)}</p>`:''}<div class="line"></div><h4 style="margin:0 0 9px">Connected ideas <span class="muted">(${related.length})</span></h4>${related.length?`<ul class="connections">${related.slice(0,12).map(ed=>{const other=findNode(ed.source===n.id?ed.target:ed.source,inv);return`<li><strong>${e(ed.type)}</strong> → <button class="btn btn-quiet btn-small" data-node="${e(other?.id||'anchor')}" style="margin:4px 0;display:block;max-width:100%;white-space:normal">${e(other?.title||'Anchor')}</button><span class="muted">${e(ed.rationale)}</span></li>`}).join('')}</ul>`:'<p class="muted">No branches selected yet. Choose a recommended question below.</p>'}<div class="line"></div><button class="btn btn-primary" data-act="explore-node">Explore this question</button><button class="btn" data-act="next-question">What should I ask next?</button><button class="btn" data-act="perspective">Explore another perspective</button><button class="btn" data-act="nav" data-target="diagnosis">Start diagnostic</button>${n.id!=='anchor'&&r?`<button class="btn btn-quiet btn-danger" data-act="remove-node">Remove this branch</button>`:''}<button class="btn btn-quiet" data-node="anchor">Back to anchor question</button></div></aside>`}
function renderRecommendations(inv){const rs=recommendations(inv);return`<section class="section-block" id="recommendations"><div class="section-title"><div><span class="eyebrow">${inv.topicId==='generic'?'Generic research starters':'Curated next questions'}</span><h2 style="margin:9px 0 0">Questions worth asking next.</h2><p class="section-kicker">Choose a card to add its branch to your map. ${inv.topicId==='generic'?'These are prompts, not verified answers about your topic.':'Each connection has a reason you can inspect.'}</p></div></div><div class="rec-grid">${rs.map(r=>`<button class="rec-card ${inv.added.includes(r.id)?'selected':''}" data-act="recommend" data-id="${e(r.id)}"><span class="tag">${e(r.category)}</span><strong>${e(r.title)}</strong><p>${e(r.summary)}</p><p class="text-small"><span class="teal">Why recommended:</span> ${e(r.reason)}</p><div class="rec-bottom"><span>${inv.explored.includes(r.id)?'Explored':inv.added.includes(r.id)?'On your map':'Add to map'}</span><span aria-hidden="true">↗</span></div></button>`).join('')}</div></section>`}
function renderMap(){const inv=state.investigation,edges=graphEdges(inv);return`<main class="app-shell no-report-print">${sectionHead('02 / Question Universe','Follow the hidden connections.',inv.anchor,`<div class="btn-row"><button class="btn btn-small" data-act="save">Save investigation</button><button class="btn btn-small btn-danger" data-act="reset-experiment">Reset</button></div>`)}<div class="topic-meta" style="margin:-5px 0 23px"><span class="tag teal-tag">${inv.topicId==='generic'?'Generic question prompts':e(topicOf(inv)?.name)}</span><span class="tag">${inv.added.length} nodes</span><span class="tag">${edges.length} explained links</span><span class="tag">${inv.explored.length} explored</span></div><div class="map-toolbar"><div class="segmented" role="group" aria-label="Map display mode"><button class="btn ${inv.viewMode==='graph'?'is-on':''}" data-act="view" data-mode="graph" aria-pressed="${inv.viewMode==='graph'}">Graph view</button><button class="btn ${inv.viewMode==='list'?'is-on':''}" data-act="view" data-mode="list" aria-pressed="${inv.viewMode==='list'}">List view</button></div><div class="btn-row"><button class="btn btn-small" data-act="zoom-out" title="Zoom out graph">− Zoom</button><button class="btn btn-small" data-act="zoom-in" title="Zoom in graph">+ Zoom</button><button class="btn btn-small" data-act="fit">Fit to screen</button><button class="btn btn-small" data-act="reset-view">Reset view</button></div></div><div class="map-layout"><div class="surface graph-card"><div class="graph-topline"><span>DISCOVERY CANVAS · ${inv.viewMode==='graph'?'Interactive SVG':'Accessible tree/list'}</span><span>${inv.viewMode==='graph'?'Select a node or connection ↗':'Select any row ↗'}</span></div>${inv.viewMode==='graph'?renderGraph(inv):renderList(inv)}<div class="graph-help">Graph: click / tap or use Tab + Enter / Space. Select an edge to read its exact rationale. List view provides the same nodes and details.</div><div class="map-key">${[['Topic / focus','gold-dot'],['Questions / examples',''],['Prerequisites','blue-dot'],['Possible hypotheses','purple-dot'],['Potential confusion','red-dot']].map(([name,color])=>`<span class="key-item"><span class="key-dot ${color}"></span>${name}</span>`).join('')}</div></div>${renderInspector(inv)}</div>${renderRecommendations(inv)}${inv.topicId==='calculus'?renderChain(inv):''}<div class="notice">${inv.topicId==='generic'?'No subject-specific facts were generated for this unknown topic. Use these structured prompts and trusted sources to investigate.':'The map uses an offline curated dataset and deterministic link logic. Opening branches changes your map and report; it does not infer what you believe.'}</div></main>`}
function renderChain(inv){const stages=[
 ['c-simplify','A possible confusion','Cancelling a factor can hide an excluded point.'],
 ['sample-2','An illustrative wrong answer','The point value is mistakenly replaced by the nearby expression.'],
 ['c-continuity','A downstream decision','The learner may apply a continuity rule to the wrong quantities.'],
 ['transfer-node','A related new problem','The same distinction can be checked in a fresh example.']];
 return`<section class="section-block"><div class="section-title"><div><span class="eyebrow">Domino Chain / Possible explanation</span><h2 style="margin:8px 0">How one confusion <em>might</em> spread.</h2><p class="section-kicker">Illustrative pathway only. It does not prove why any student made an error. Choose a stage to focus it on the map.</p></div></div><div class="chain">${stages.map(([id,title,body],i)=>`${i?`<div class="chain-arrow" aria-hidden="true">→<small>${e(['','may affect interpretation','may affect a decision','leads to a new check'][i])}</small></div>`:''}<button class="chain-stage" data-act="chain" data-id="${e(id)}"><b>STAGE ${i+1}</b><strong style="display:block;margin:8px 0">${e(title)}</strong><small class="muted">${e(body)}</small></button>`).join('')}</div></section>`}
function renderExampleErrors(){return`<section class="section-block"><div class="section-title"><div><span class="eyebrow">Preloaded demonstration evidence</span><h2 style="margin:8px 0">Three mistakes. Several possible explanations.</h2><p class="section-kicker">These are illustrative learner responses in the guided case, <strong>not</strong> answers you submitted. They are never counted as evidence about you.</p></div></div><div class="grid-three">${SAMPLE_ERRORS.map((s,i)=>`<article class="surface panel"><div class="btn-row" style="justify-content:space-between"><span class="tag rose-tag">EXAMPLE ERROR 0${i+1}</span><button class="btn btn-small btn-quiet" data-act="focus" data-id="${s.id}">View on map</button></div><h3 style="margin:14px 0 9px">${e(s.question)}</h3><p><strong>Illustrative learner answer:</strong><br>${e(s.answer)}</p><p><strong>Correct answer:</strong> <span class="teal">${e(s.correct)}</span></p><p class="text-small">${e(s.explanation)}</p></article>`).join('')}</div></section>`}
function renderBaseline(inv){const b=inv.baseline||{};return`<section class="surface panel" style="margin-bottom:18px"><span class="eyebrow">Your own evidence · Optional baseline</span><h3 style="margin:10px 0">What would you answer before the learning activity?</h3><p>Use the original piecewise function. You can revise these responses later; only submitted responses appear in your report as your own work.</p><div class="math">f(x) = (x² − 1)/(x − 1) when x ≠ 1; &nbsp; f(1) = 5</div><form id="baseline-form" style="margin-top:17px"><div class="grid-three"><label class="field">1. What is lim(x→1) f(x)?<input type="text" name="limit" inputmode="decimal" placeholder="Number" value="${e(b.limit??'')}" required></label><label class="field">2. What is f(1)?<input type="text" name="point" inputmode="decimal" placeholder="Number" value="${e(b.point??'')}" required></label><label class="field">3. Is f continuous at x=1?<select name="continuity" required><option value="">Choose</option><option value="yes" ${b.continuity==='yes'?'selected':''}>Yes</option><option value="no" ${b.continuity==='no'?'selected':''}>No</option><option value="unsure" ${b.continuity==='unsure'?'selected':''}>Not sure</option></select></label></div><div class="btn-row"><button class="btn btn-primary" type="submit">${inv.baseline?'Update my baseline':'Record my baseline'}</button>${inv.baseline?'<span class="tag teal-tag">Baseline submitted</span>':''}</div></form></section>`}

 put('','BEFORE / AFTER COMPARISON');if(inv.topicId==='calculus'&&inv.baseline&&attempt){const baselineCorrect=[asNumber(inv.baseline.limit)===2,asNumber(inv.baseline.point)===5,inv.baseline.continuity==='no'];bullet(['Limit','Point value','Continuity'].map((name,i)=>`${name}: initial ${baselineCorrect[i]?'correct':'not correct or uncertain'}; latest transfer ${attempt.results[i]?.correct?'correct':'not correct or uncertain'}.`));put('These were different questions. The responses alone cannot establish lasting learning or prove what caused a change.')}else if(attempt)put('  - Transfer answers were submitted, but there is no comparable three-part learner baseline (or this is a different topic). Do not infer improvement.');else put('  - No before/after comparison is possible without actual submitted transfer answers.');
 put('','UNRESOLVED QUESTIONS');const unresolved=rs.filter(r=>!inv.explored.includes(r.id));bullet(unresolved.slice(0,4).map(r=>r.title));if(inv.topicId==='calculus'&&!inv.diagnostic)put('  - Which hypothesis is most consistent with your own diagnostic answer? This remains untested.');if(!attempt)put('  - Can you apply the idea to the fresh transfer example? Not yet tested.');if(inv.topicId==='generic')put('  - Validate examples and claims using an independent trusted source.');
 put('','SUGGESTED NEXT STEPS',inv.topicId==='calculus'?'  - Compare the point value and nearby limit separately; then use the continuity condition.':'  - Explore at least one prerequisite and one counterexample on the question map.',attempt?'  - Review any incorrect transfer parts, then retry with an explanation.':'  - Finish the learning check and submit the fresh transfer question.','  - Consider an alternative explanation when evidence is mixed.','', 'SCOPE & LIMITATIONS','This report only describes selections and submitted responses within a local offline prototype. Example errors are illustrative and not evidence about this learner. Categorical hypotheses are possibilities, not psychological diagnoses or validated causal findings. One correct response does not demonstrate lasting learning. Content is curated with deterministic rules; there is no live AI, secure cloud account, backend, or cross-device sync.');return lines.join('\n')}
function renderApp(keepScroll=false){const y=keepScroll?window.scrollY:0;const main=state.investigation?({home:renderHome,map:renderMap,diagnosis:renderDiagnosis,reversal:renderReversal}[state.section]||renderHome)():state.section==='home'?renderHome():renderEmpty(state.section);document.getElementById('app').innerHTML=renderHeader()+main+`<div class="app-shell no-print">${renderFooter()}</div>`+`<section class="print-only" aria-label="Printable Discovery Report"><h1>DominoVerse — Discovery Report</h1><pre class="report-preview">${e(makeReport())}</pre></section>`+renderModal();if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0)}
// ================================================================
// CONTROLLERS: delegated click, keyboard, form, and input handlers.
// ================================================================
function navigate(section){state.section=section;state.ui.formError='';if(state.investigation){if(section==='diagnosis')addLabNodes();if(section==='reversal')addLearningNodes();if(!state.investigation.sectionVisited.includes(section))state.investigation.sectionVisited.push(section)}persist();renderApp()}
function begin(text,explicit){const value=text.trim();if(!value){state.ui.inputError='Please enter a topic, question, or doubt before starting.';const el=document.getElementById('question-validation');if(el)el.textContent=state.ui.inputError;document.getElementById('question-input')?.focus();return}state.ui.inputError='';state.investigation=createInvestigation(value,explicit);state.section='map';persist();renderApp();toast('Investigation started. Select a related question to add it to the map.')}
function guided(){if(state.investigation&&!window.confirm('Start a fresh guided investigation? Your current investigation can be saved first.'))return;state.profile=state.profile||{mode:'guest',name:'Guest explorer',level:'',interest:''};state.onboardingOpen=false;begin(TOPICS.calculus.prompt,'calculus')}
function openNode(id,goToMap=false){if(!state.investigation||!findNode(id))return;addNode(id);if(goToMap)state.section='map';renderApp(!goToMap)}
function selectEdge(index){const inv=state.investigation,edges=graphEdges(inv);if(!edges[index])return;inv.edgeSelected=index;inv.selectedNode=edges[index].source;persist();renderApp(true)}
function saveInvestigation(){const inv=state.investigation;if(!inv){toast('Start an investigation before saving.');return}const entry={id:'save-'+Date.now(),title:inv.anchor,topic:topicOf(inv)?.name||'Custom question',savedAt:new Date().toISOString(),data:JSON.parse(JSON.stringify(inv))};state.history.unshift(entry);state.history=state.history.slice(0,12);persist();toast(storageAvailable?'Saved to this browser. You can reopen it from Discovery Home.':'Saved in this tab only. Browser storage is unavailable.')}
function resetExperiment(){if(!window.confirm('Reset this investigation? Current unsaved answers and the active report will be cleared. Explicitly saved history is kept until deleted.'))return;state.investigation=null;state.section='home';state.ui={inputError:'',formError:''};storageRemove(STORAGE.active);persist();renderApp();toast('Current experiment reset to a clean starting state.')}
function clearAll(){if(!window.confirm('Clear ALL DominoVerse local data, including learner profile, saved history, and current work?'))return;for(const key of Object.values(STORAGE))storageRemove(key);state.profile=null;state.investigation=null;state.history=[];state.onboardingOpen=true;state.section='home';state.ui={inputError:'',formError:''};renderApp();toast('Local data cleared in this browser where storage was available.')}
function invokeAction(target){const act=target.dataset.act,inv=state.investigation;
 switch(act){
 case'nav':navigate(target.dataset.target);break;
 case'profile':state.onboardingOpen=true;renderApp(true);break;
 case'close-profile':state.onboardingOpen=false;renderApp(true);break;
 case'guest':state.profile={mode:'guest',name:'Guest explorer',level:'',interest:''};state.onboardingOpen=false;persist();renderApp(true);toast('Continuing as guest. No cloud account was created.');break;
 case'guided':guided();break;
 case'topic':if(inv&&!window.confirm('Start a new topic investigation? Save the current one first if needed.'))return;state.profile=state.profile||{mode:'guest',name:'Guest explorer'};state.onboardingOpen=false;begin(TOPICS[target.dataset.topic].prompt,target.dataset.topic);break;
 case'resume':if(inv)navigate('map');break;
 case'reopen':{const saved=state.history.find(x=>x.id===target.dataset.id);if(!saved)return;state.investigation=normalizeSaved(JSON.parse(JSON.stringify(saved.data)));navigate('map');toast('Saved investigation reopened.');break}
 case'delete-save':if(window.confirm('Delete this saved snapshot?')){state.history=state.history.filter(x=>x.id!==target.dataset.id);persist();renderApp(true)}break;
 case'clear-all':clearAll();break;
 case'save':saveInvestigation();break;
 case'reset-experiment':resetExperiment();break;
 case'recommend':openNode(target.dataset.id);break;
 case'focus':case'chain':openNode(target.dataset.id,true);break;
 case'view':if(!inv)return;inv.viewMode=target.dataset.mode;persist();renderApp(true);break;
 case'zoom-in':if(!inv)return;inv.viewMode='graph';inv.zoom=Math.min(1.8,Math.round((inv.zoom+.2)*10)/10);persist();renderApp(true);break;
 case'zoom-out':if(!inv)return;inv.viewMode='graph';inv.zoom=Math.max(.8,Math.round((inv.zoom-.2)*10)/10);persist();renderApp(true);break;
 case'fit':if(!inv)return;inv.viewMode='graph';inv.zoom=1;persist();renderApp(true);toast('Graph fitted to the canvas.');break;
 case'reset-view':if(!inv)return;inv.viewMode='graph';inv.zoom=1;inv.selectedNode='anchor';inv.edgeSelected=null;persist();renderApp(true);toast('Graph view and selection reset. Your investigation remains intact.');break;
 case'explore-node':if(!inv)return;if(inv.selectedNode==='anchor'){document.getElementById('recommendations')?.scrollIntoView({behavior:'smooth'});toast('Choose a related question below to explore a new branch.');break}addNode(inv.selectedNode,true);renderApp(true);toast('Marked as explored. The report now includes this branch.');break;
 case'remove-node':if(!inv||inv.selectedNode==='anchor')return;const current=inv.selectedNode;inv.added=inv.added.filter(id=>id!==current);inv.selectedNode='anchor';inv.edgeSelected=null;inv.explored=inv.explored.filter(id=>id!==current);persist();renderApp(true);toast('Branch removed from the map.');break;
 case'next-question':{if(!inv)return;const options=recommendations(inv).filter(x=>!inv.explored.includes(x.id));if(!options.length){toast('All currently curated questions have been explored. Try a diagnostic or a different topic.');return}addNode(options[0].id);renderApp(true);toast('A new question was added and selected.');break}
 case'perspective':{if(!inv)return;const r=recommendations(inv).find(x=>['Counterexample','Common Confusion','Related Concept'].includes(x.category)&&x.id!==inv.selectedNode&&!inv.perspectives.includes(x.id));if(!r){navigate('diagnosis');toast('Compare hypotheses in the Diagnosis Lab.');return}inv.perspectives.push(r.id);addNode(r.id);renderApp(true);toast('A contrasting perspective is now selected.');break}
 case'select-hypothesis':if(!inv)return;inv.selectedHypothesis=target.dataset.id;persist();renderApp(true);break;
 case'toggle-challenge':if(!inv)return;inv.challengeOpen=!inv.challengeOpen;persist();renderApp(true);break;
 case'other-perspective':{if(!inv)return;const r=recommendations(inv).find(x=>x.category==='Counterexample');if(r){addNode(r.id);navigate('map')}break}
 case'revisit':if(!inv)return;document.querySelector('.page-head')?.scrollIntoView({behavior:'smooth'});toast('Review the explanation and update your check answer if needed.');break;
 case'proceed-transfer':if(!inv)return;document.getElementById('transfer-section')?.scrollIntoView({behavior:'smooth',block:'start'});toast('Answer every part of the new transfer question.');break;
 case'retry-transfer':if(!inv)return;inv.transfer.revision++;persist();renderApp(true);document.getElementById('transfer-section')?.scrollIntoView({block:'start'});toast('New blank attempt ready. Previous submissions remain in the report.');break;
 case'copy-report':copyReport();break;
 case'download-report':downloadReport();break;
 case'print-report':printReport();break;
 }
}
document.addEventListener('click',event=>{const target=event.target.closest('[data-act],[data-node],[data-edge]');if(!target)return;event.preventDefault();if(target.dataset.act)invokeAction(target);else if(target.dataset.node)openNode(target.dataset.node);else if(target.dataset.edge!==undefined)selectEdge(Number(target.dataset.edge))});
document.addEventListener('keydown',event=>{if(event.target.id==='question-input'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();begin(event.target.value);return}if((event.key==='Enter'||event.key===' ')&&event.target.matches('svg [data-node],svg [data-edge]')){event.preventDefault();const el=event.target;if(el.dataset.node)openNode(el.dataset.node);else if(el.dataset.edge!==undefined)selectEdge(Number(el.dataset.edge))}});
document.addEventListener('input',event=>{if(event.target.id==='near-slider'){const x=Number(event.target.value);const el=document.getElementById('near-value'),out=document.getElementById('near-output');if(el)el.textContent=x.toFixed(2);if(out)out.textContent=Math.abs(x-1)<1e-8?'At x=1, use the separate definition: f(1)=5. The original fraction is undefined here.':`For x≠1: f(${x.toFixed(2)}) = ${nearbyValue(x).toFixed(2)}`}});
document.addEventListener('change',event=>{if(event.target.id==='near-slider'&&state.investigation){const inv=state.investigation,x=Number(event.target.value);inv.learning.sample=x;if(!inv.learning.visitedValues.includes(x))inv.learning.visitedValues.push(x);persist();renderApp(true)}});
document.addEventListener('submit',event=>{const form=event.target;event.preventDefault();const data=Object.fromEntries(new FormData(form).entries());const inv=state.investigation;
 if(form.id==='profile-form'){const name=String(data.name||'').trim();if(!name){toast('Please enter a display name or choose guest.');return}state.profile={mode:'local',name:name.slice(0,40),level:String(data.level||'').trim().slice(0,55),interest:String(data.interest||'').trim().slice(0,60)};state.onboardingOpen=false;persist();renderApp(true);toast('Local learner profile saved in this browser when storage is available.');return}
 if(form.id==='question-form'){begin(String(data.question||''));return}
 if(!inv)return;
 if(form.id==='baseline-form'){if(!data.limit?.trim()||!data.point?.trim()||!data.continuity){toast('Please answer all baseline parts, or skip this optional baseline.');return}inv.baseline={limit:String(data.limit).trim(),point:String(data.point).trim(),continuity:data.continuity};persist();renderApp(true);toast('Your own initial answers are recorded separately from the example errors.');return}
 if(form.id==='diagnostic-form'||form.id==='other-diagnostic-form'){if(!data.choice){toast('Choose a response to continue.');return}inv.diagnostic=data.choice;if(inv.topicId==='calculus'&&!inv.added.includes('diag-evidence'))inv.added.push('diag-evidence');persist();renderApp(true);toast('Your answer updated the evidence assessment and discovery report.');return}
 if(form.id==='challenge-form'){if(!data.choice){toast('Choose an answer to challenge this hypothesis.');return}inv.challenge=data.choice;persist();renderApp(true);toast('The alternative diagnostic updated the competing hypotheses.');return}
 if(form.id==='reflection-form'){const confusion=String(data.confusion||'').trim(),question=String(data.question||'').trim();if(!confusion||!question){toast('Complete both reflection fields.');return}inv.reflection={confusion,question};persist();renderApp(true);toast('Your own diagnostic question was recorded without automatic grading.');return}
 if(form.id==='lesson-form'){if(!data.choice){toast('Select a statement for the learning check.');return}inv.learning.check=data.choice;inv.learning.complete=true;persist();renderApp(true);toast('Learning check submitted. Next, try a fresh transfer question.');return}
 if(form.id==='transfer-form'){const required=inv.topicId==='calculus'?['limit','point','continuity']:inv.topicId==='physics'?['acceleration','direction','unit']:inv.topicId==='logic'?['original','converse','example']:['example','confidence'];if(required.some(k=>!String(data[k]||'').trim())){toast('Please answer every part before submitting.');return}const answers=Object.fromEntries(required.map(k=>[k,String(data[k]).trim()]));inv.transfer.attempts.push({when:new Date().toISOString(),answers,results:transferEvaluate(inv.topicId,answers)});persist();renderApp(true);toast('Transfer responses scored by part where an answer key exists; report updated.');return}
});

// EXPORTS: native browser APIs, clipboard fallback and printing.
// ================================================================
async function copyReport(){const report=makeReport();try{if(!navigator.clipboard?.writeText)throw Error('Clipboard API unavailable');await navigator.clipboard.writeText(report);toast('Discovery Report copied to clipboard.');return}catch(_){const field=document.createElement('textarea');field.value=report;field.setAttribute('readonly','');field.style.cssText='position:fixed;top:-9999px;left:-9999px;';document.body.appendChild(field);field.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}field.remove();toast(ok?'Report copied using browser fallback.':'Clipboard access unavailable. Select the report preview and copy it manually, or use Download .txt.')}}
function downloadReport(){try{const blob=new Blob([makeReport()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='DominoVerse_Discovery_Report.txt';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('A plain-text report download was requested.')}catch(err){toast('Could not prepare a file. Copy the report text instead.')}}
function printReport(){if(!state.investigation){toast('Start an investigation first.');return}if(state.section!=='reversal')navigate('reversal');else renderApp(true);setTimeout(()=>{try{window.print();toast('Use your browser print dialog to print or save as PDF.')}catch(err){toast('Print dialog unavailable. Copy or download the report instead.')}},100)}
renderApp();
</script>
